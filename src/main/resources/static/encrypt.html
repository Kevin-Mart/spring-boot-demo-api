<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cifrado AES</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <strong>Demo App</strong>
    <div class="links">
      <a href="dashboard.html">← Volver</a>
      <button class="secondary" onclick="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container">
    <h1>Cifrado AES/CBC/PKCS5Padding</h1>
    <div id="error" class="error" style="display:none;"></div>

    <label for="plainText">Texto a cifrar</label>
    <textarea id="plainText" placeholder="Escribe cualquier texto..."></textarea>
    <button onclick="cifrar()">Cifrar</button>

    <div id="encryptResult" class="result-box" style="display:none;"></div>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #d0d7de;">

    <label for="cipherText">Texto cifrado (Base64) a descifrar</label>
    <textarea id="cipherText" placeholder="Pega aquí un texto cifrado..."></textarea>
    <button class="secondary" onclick="descifrar()">Descifrar</button>

    <div id="decryptResult" class="result-box" style="display:none;"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();

    const errorBox = document.getElementById('error');

    async function cifrar() {
      errorBox.style.display = 'none';
      const text = document.getElementById('plainText').value;

      if (!text) {
        errorBox.textContent = 'Escribe un texto para cifrar';
        errorBox.style.display = 'block';
        return;
      }

      const response = await apiFetch('/api/encryption/encrypt', {
        method: 'POST',
        body: JSON.stringify({ text }), // el DTO EncryptRequest usa el campo "text"
      });
      if (!response) return;

      const box = document.getElementById('encryptResult');
      if (!response.ok) {
        errorBox.textContent = 'Error al cifrar el texto';
        errorBox.style.display = 'block';
        box.style.display = 'none';
        return;
      }

      const data = await response.json();
      box.innerHTML = `<p><strong>Resultado cifrado:</strong></p><p style="word-break: break-all;">${data.textoCifrado ?? JSON.stringify(data)}</p>`;
      box.style.display = 'block';

      // Autocompleta el campo de descifrado para probar rápido
      document.getElementById('cipherText').value = data.textoCifrado ?? '';
    }

    async function descifrar() {
      errorBox.style.display = 'none';
      const textCifrado = document.getElementById('cipherText').value;

      if (!textCifrado) {
        errorBox.textContent = 'Pega un texto cifrado para descifrar';
        errorBox.style.display = 'block';
        return;
      }

      const response = await apiFetch('/api/encryption/decrypt', {
        method: 'POST',
        body: JSON.stringify({ textCifrado }), // el DTO DecryptRequest usa el campo "textCifrado"
      });
      if (!response) return;

      const box = document.getElementById('decryptResult');
      if (!response.ok) {
        errorBox.textContent = 'Error al descifrar (revisa que el texto cifrado sea válido)';
        errorBox.style.display = 'block';
        box.style.display = 'none';
        return;
      }

      const data = await response.json();
      box.innerHTML = `<p><strong>Texto original:</strong></p><p>${data.texto ?? JSON.stringify(data)}</p>`;
      box.style.display = 'block';
    }
  </script>
</body>
</html>
