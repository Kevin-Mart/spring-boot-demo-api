<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pokédex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <strong>Demo App</strong>
    <div class="links">
      <a href="dashboard.html">← Volver</a>
      <button class="secondary" onclick="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container">
    <h1>Buscar Pokémon</h1>
    <div id="error" class="error" style="display:none;"></div>

    <label for="pokemonName">Nombre del pokémon</label>
    <input type="text" id="pokemonName" placeholder="Ej. ditto">
    <button onclick="buscarPokemon()">Buscar</button>

    <div id="result" class="result-box" style="display:none;"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();

    const errorBox = document.getElementById('error');
    const resultBox = document.getElementById('result');

    async function buscarPokemon() {
      errorBox.style.display = 'none';
      resultBox.style.display = 'none';

      const name = document.getElementById('pokemonName').value.trim();
      if (!name) {
        errorBox.textContent = 'Escribe el nombre de un pokémon';
        errorBox.style.display = 'block';
        return;
      }

      const response = await apiFetch(`/api/pokemon/${encodeURIComponent(name.toLowerCase())}`);
      if (!response) return;

      if (!response.ok) {
        errorBox.textContent = response.status === 404
          ? 'No se encontró ese pokémon'
          : 'Error al consultar la PokeAPI';
        errorBox.style.display = 'block';
        return;
      }

      const data = await response.json();
      resultBox.innerHTML = `
        <p><strong>Nombre:</strong> ${data.name}</p>
        <p><strong>Peso:</strong> ${data.weight}</p>
        <p><strong>Altura:</strong> ${data.height}</p>
        <p><strong>Tipo:</strong> ${data.type.join(', ')}</p>
      `;
      resultBox.style.display = 'block';
    }
  </script>
</body>
</html>
