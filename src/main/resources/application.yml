spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
app:

  encryption:
    secret-key: "1234567890123456"
    iv: "abcdefghijklmnop"


  jwt:
    # Clave secreta (mínimo 256 bits). 
    secret-key: "VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRLZXlGb3JKV1Q="
    expiration-minutes: 60
    refresh-token:
      expiration: 604800000 # 7 days